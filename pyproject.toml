[build-system]  # https://docs.astral.sh/uv/concepts/build-backend/
requires = ["uv_build>=0.9.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "baseline-core"
version = "0.1.0"
description = "Reusable Baseline modules, vendored into projects by baseline-app-template."
authors = [{ name = "Francois-Alexandre Tremblay", email = "francois-alexandre.tremblay@baseline.quebec" }]
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.12,<4.0"
dependencies = []

# One extra per module. They let this repository test a module in isolation
# (`uv sync --all-extras` installs them all for mypy and the full test run);
# projects never install baseline-core, they receive the module's source and its
# dependencies are added to them.
[project.optional-dependencies]
graph = ["networkx>=3.6.1", "pydantic>=2.10.0"]
graph-plot = ["matplotlib>=3.10.0"]
ml-graph = ["baseline-core[graph]", "torch>=2.5", "torch-geometric>=2.6"]
# core/llm/document_extraction: read a PDF or a workbook, then the agents index and extract.
document-extraction = [
  "cffi>=1.16.0", "loguru>=0.7.3", "openpyxl>=3.1.0", "pillow>=10.0.0", "pydantic>=2.10.0",
  "pydantic-ai-slim>=1.0", "pypdfium2>=5.0.0", "rapidfuzz>=3.9.0",
]
qdrant = ["qdrant-client[fastembed]>=1.12.0,<2", "pydantic-ai-slim>=1.0", "loguru>=0.7.3"]
weaviate = ["weaviate-client>=4.10.0", "pydantic-ai-slim>=1.0", "loguru>=0.7.3"]
mongo = ["loguru>=0.7.3", "pydantic>=2.10.0", "pymongo>=4.13"]
gateway = ["httpx>=0.28.0", "loguru>=0.7.3", "pydantic>=2.10.0"]
llm = ["loguru>=0.7.3", "mlflow>=3.0", "pydantic>=2.10.0", "pydantic-ai-slim>=1.0"]
optimization = ["cython>=3.0.0", "numpy>=2.0.0", "pydantic>=2.10.0"]
ml = [
  "fsspec>=2024.6.0", "gitpython>=3.1.0", "loguru>=0.7.3", "mlflow>=3.0",
  "omegaconf>=2.3.0", "onnx>=1.17.0", "onnxruntime>=1.20.0", "onnxscript>=0.2.0",
  "pandas>=2.2.0", "pillow>=10.0.0", "psutil>=6.0.0", "pycocotools>=2.0.8",
  "pydantic-settings>=2.7.0", "pytorch-lightning>=2.5.0", "torch>=2.5", "torchmetrics>=1.6.0",
  "torchvision>=0.20", "transformers>=4.50.0",
]
# RemoteFolder on az:// (adlfs, credentials from DefaultAzureCredential).
ml-azure-storage = ["baseline-core[ml]", "adlfs>=2024.7.0", "azure-identity>=1.19.0"]
ml-jobs = ["baseline-core[ml]", "azure-ai-ml>=1.26.0", "azure-identity>=1.19.0", "nvidia-ml-py>=12.560.30"]
api = [
  "dishka>=1.10.1", "fastapi>=0.115.0", "httpx>=0.28.0", "loguru>=0.7.3", "pydantic-settings>=2.7.0",
  "uvicorn>=0.34.0",
]

[dependency-groups]
test = [
  "archunitpython>=1.8.1",
  "codespell>=2.4.0",
  "commitizen>=4.18.0",
  "coverage[toml]>=7.6.0",
  "detect-secrets>=1.5.0",
  "mongomock>=4.3.0",
  "mypy>=1.14.0",
  "poethepoet>=0.32.0",
  "pre-commit>=4.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "respx>=0.22.0",
  "ruff>=0.11.0",
  "shellcheck-py>=0.10.0.1",
]

[tool.commitizen]  # https://commitizen-tools.github.io/commitizen/config/
bump_message = "bump(release): v$current_version → v$new_version"
tag_format = "v$version"
update_changelog_on_bump = true
version_provider = "uv"

[tool.uv]
default-groups = ["test"]

# torch from the CPU wheels: tests never need CUDA.
[tool.uv.sources]  # https://docs.astral.sh/uv/guides/integration/pytorch/
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "baseline_core"
module-root = "src"

[tool.pytest.ini_options]
addopts = "--color=yes --strict-config --strict-markers --verbosity=2"
asyncio_mode = "auto"
markers = ["azure: talks to a real Azure ML workspace; needs AZURE_ML_* in the environment and az login"]
testpaths = ["tests"]
xfail_strict = true

[tool.mypy]
strict = true
disallow_subclassing_any = false
ignore_missing_imports = true
plugins = "pydantic.mypy"
files = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff]
line-length = 99
preview = true
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
# The docs' code samples keep their aligned comments.
exclude = ["*.md"]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
# Same rule set as a strict project generated by baseline-app-template, so a
# module that passes here passes in the project that receives it.
select = ["ALL"]
ignore = [
  "ANN002", "ANN003", "COM812", "CPY001", "E501", "E731", "RET504", "S311", "TRY003",
  "W505", "ISC001", "DOC201", "DOC501", "PLC0415", "RUF105", "RUF201", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "INP001", "D100", "D101", "SLF", "PLR2004", "PLR6301", "RUF069"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-public-methods = 30

[tool.coverage.report]  # https://coverage.readthedocs.io/en/latest/config.html#report
precision = 1
show_missing = true
skip_covered = true

[tool.coverage.run]  # https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
command_line = "--module pytest"
data_file = "reports/.coverage"
source = ["src"]

[tool.coverage.html]  # https://coverage.readthedocs.io/en/latest/cmd.html#html-reporting-coverage-html
directory = "reports/htmlcov"

[tool.coverage.xml]  # https://coverage.readthedocs.io/en/latest/cmd.html#cmd-xml
output = "reports/coverage.xml"

[tool.codespell]  # https://github.com/codespell-project/codespell
builtin = "clear,code,rare"
check-filenames = true
# French words of the docs and comments, and English ones the dictionaries misread.
ignore-words-list = "algorithmes,aligne,approuve,arange,attribut,attributs,blocs,bloc,bord,branche,candidat,candidats,cas,celle,celles,classe,commun,comparaisons,complet,conflits,copie,correspondant,crate,dont,dur,enveloppe,exemple,exemples,existant,explicite,falsy,fixe,fo,fonction,formes,groupe,groupes,invalide,juge,lient,listent,manipule,mesure,mesures,methode,mis,mot,moteur,objet,objets,persistance,processus,projet,raison,ressource,ressources,reste,servent,somme,sur,valide,vise"
skip = "./*_cache/,./.venv,./reports,./uv.lock"

[tool.poe]  # https://poethepoet.natn.io/guides/uv_guide.html
# Run tasks in the already-activated virtualenv instead of re-resolving through
# `uv run`, which would trigger an implicit `uv sync` on every task.
executor.type = "simple"

[tool.poe.tasks]  # https://github.com/nat-n/poethepoet

  [tool.poe.tasks.lint]
  help = "Lint the package"
  cmd = """
    pre-commit run
      --all-files
      --color always
    """

  [tool.poe.tasks.test]
  help = "Test the package"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage run"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage report"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage html"

    [[tool.poe.tasks.test.sequence]]
    cmd = "coverage xml"
