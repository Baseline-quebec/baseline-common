name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    name: Python ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Every module's extra: the tests cover all of them.
      - name: Install the package
        run: uv sync --all-extras --locked

      - name: Lint package
        run: uv run --locked poe lint

      # GitHub's Ubuntu runner lacks Microsoft's ODBC driver; its package names the repository.
      - name: Install the ODBC driver of SQL Server
        run: |
          . /etc/os-release
          curl --fail --silent --show-error --location --output /tmp/packages-microsoft-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb"
          sudo dpkg --install /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install --yes --no-install-recommends msodbcsql18 unixodbc

      # The SQL Server tests skip without Microsoft's ODBC driver; here they must run.
      - name: Check the ODBC driver of SQL Server
        run: >-
          uv run --locked python -c "import pyodbc, sys;
          sys.exit('ODBC Driver 18 for SQL Server' not in pyodbc.drivers())"

      - name: Test package
        run: uv run --locked poe test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          path: reports/htmlcov/
          name: coverage-report-${{ matrix.python-version }}
          retention-days: 7
